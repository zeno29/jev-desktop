<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jev</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* "Stream" (design handoff 3b): every line is its own dark-glass bubble hanging under the orb.
     WebView2 can't be see-through on Windows, so the app cuts the window to the bubbles' shapes
     (every element with .shape reports its box, see reportShapes): the wallpaper shows between
     bubbles and clicks there reach the desktop. The bubbles themselves are solid dark glass. */
  @font-face { font-family: "Geist"; src: url("fonts/Geist.ttf") format("truetype"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono.ttf") format("truetype"); font-weight: 100 900; }

  :root {
    --c: #54dcff; --c-rgb: 84, 220, 255;
    --sans: "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", "Cascadia Mono", Consolas, monospace;
    --glass: 5, 8, 12;
  }
  body[data-state="listening"]    { --c: #96f0ff; --c-rgb: 150, 240, 255; }
  body[data-state="transcribing"],
  body[data-state="routing"]      { --c: #7fe9ff; --c-rgb: 127, 233, 255; }
  body[data-state="action"]       { --c: #3dffb8; --c-rgb: 61, 255, 184; }
  body[data-state="fast"]         { --c: #38e8e0; --c-rgb: 56, 232, 224; }
  body[data-state="deep"]         { --c: #8c9dff; --c-rgb: 140, 157, 255; }
  body[data-state="speaking"]     { --c: #69cdff; --c-rgb: 105, 205, 255; }
  body[data-state="confirm"]      { --c: #ffb84d; --c-rgb: 255, 184, 77; }
  body[data-state="error"]        { --c: #ff5d6e; --c-rgb: 255, 93, 110; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: #fff;
               font-family: var(--sans); -webkit-font-smoothing: antialiased; user-select: none; }

  #stream { position: absolute; left: 0; right: 0; top: 0; max-height: 100%;
            display: flex; flex-direction: column; gap: 8px; }
  body[data-anchor="bottom"] #stream { top: auto; bottom: 0; }   /* orb near the bottom: grow upwards */

  #log { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto;
         scrollbar-width: none; user-select: text; }
  #log::-webkit-scrollbar { display: none; }

  .shape { transition: border-color .35s, box-shadow .35s; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

  /* 1. user line */
  .msg.user { align-self: flex-end; max-width: 78%; display: flex; flex-direction: column; align-items: flex-end;
              gap: 4px; animation: rise .25s ease-out; }
  .msg.user .bubble { padding: 9px 15px; border-radius: 18px 18px 6px 18px; background: rgba(var(--glass), .62);
                      border: 1px solid rgba(255, 255, 255, .08); font: 400 13.5px/1.4 var(--sans);
                      color: rgba(255, 255, 255, .72); overflow-wrap: anywhere; }
  .route { font: 500 10.5px var(--mono); color: rgba(255, 255, 255, .85); margin-right: 6px; padding: 2px 8px;
           border-radius: 999px; background: rgba(var(--glass), .62); }

  /* 2. Jev line */
  .entry.jev { align-self: flex-start; max-width: 86%; display: flex; flex-direction: column; gap: 10px;
               padding: 12px 16px; border-radius: 18px 18px 18px 6px; background: rgba(var(--glass), .88);
               border: 1px solid rgba(255, 255, 255, .07); box-shadow: 0 10px 30px rgba(0, 20, 30, .22);
               font: 500 15.5px/1.4 var(--sans); letter-spacing: -.01em; color: #fff; white-space: pre-wrap;
               overflow-wrap: anywhere; animation: rise .25s ease-out; }
  .entry.jev.caret::after { content: "▍"; color: var(--c); animation: blink .8s steps(1) infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 6. system / notify */
  .entry.system { align-self: center; padding: 4px 12px; border-radius: 999px; background: rgba(var(--glass), .7);
                  font: 500 10.5px var(--mono); letter-spacing: .06em; color: #ffb84d; text-align: center;
                  max-width: 92%; animation: rise .25s ease-out; }

  /* 3. live bubble */
  #live { position: relative; align-self: flex-start; max-width: 86%; overflow: hidden; display: none;
          flex-direction: column; gap: 5px; padding: 12px 16px; border-radius: 18px 18px 18px 6px;
          background: rgba(var(--glass), .9); border: 1px solid rgba(var(--c-rgb), .5);
          box-shadow: 0 0 30px rgba(var(--c-rgb), .15); animation: rise .25s ease-out; }
  body.live #live { display: flex; }
  #live .glow { position: absolute; left: -40px; top: -80px; width: 260px; height: 160px; pointer-events: none;
                background: radial-gradient(ellipse at center, rgba(var(--c-rgb), .3) 0%, transparent 65%);
                opacity: .45; }
  #live .label { position: relative; font: 500 10px var(--mono); letter-spacing: .2em; color: var(--c);
                 text-transform: uppercase; transition: color .35s; }
  #live .text { position: relative; font: 500 15.5px/1.4 var(--sans); color: #fff; overflow-wrap: anywhere; }

  /* 5. approval */
  #confirm { display: none; flex-direction: column; gap: 10px; padding: 12px 16px; border-radius: 18px;
             background: rgba(var(--glass), .9); border: 1px solid rgba(255, 184, 77, .6);
             box-shadow: 0 0 30px rgba(255, 184, 77, .15); animation: rise .25s ease-out; }
  #confirm.open { display: flex; }
  #confirm .label { font: 500 10px var(--mono); letter-spacing: .2em; color: #ffb84d; }
  #confirm .q { font: 400 13.5px/1.45 var(--sans); color: rgba(255, 255, 255, .85); white-space: pre-wrap;
                max-height: 150px; overflow-y: auto; }
  #confirm .buttons { display: flex; gap: 8px; justify-content: flex-end; }
  #confirm button { font: 600 12px var(--sans); letter-spacing: .08em; padding: 8px 16px; border-radius: 999px;
                    cursor: pointer; border: 1px solid rgba(255, 184, 77, .7); background: rgba(255, 184, 77, .16);
                    color: #ffe2b3; }
  #confirm button.deny { border-color: rgba(255, 255, 255, .2); background: transparent; color: rgba(255, 255, 255, .6); }
  #confirm button:hover { filter: brightness(1.3); }
  #confirm kbd { font: 500 10px var(--mono); opacity: .6; margin-left: 6px; }

  /* 4. command bar */
  .inputbar { margin-top: 4px; flex: none; display: flex; align-items: center; gap: 12px; height: 56px;
              padding: 0 9px 0 20px; border-radius: 999px; background: rgba(var(--glass), .88);
              border: 1px solid rgba(255, 255, 255, .09); box-shadow: 0 14px 40px rgba(0, 20, 30, .3); }
  body.listening .inputbar, .inputbar:focus-within {
    border-color: rgba(var(--c-rgb), .6); box-shadow: 0 14px 40px rgba(0, 20, 30, .3), 0 0 24px rgba(var(--c-rgb), .25); }
  #input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #e6f8ff;
           font: 400 15px var(--sans); caret-color: var(--c); user-select: text; }
  #input::placeholder { color: rgba(190, 236, 255, .32); }
  #bars { display: none; align-items: center; gap: 2px; height: 20px; }
  body.listening #bars { display: flex; }
  #bars span { width: 2.5px; height: 20px; border-radius: 2px; background: var(--c); transform: scaleY(.12); }
  #hotkey { font: 500 10.5px var(--mono); color: rgba(255, 255, 255, .45); white-space: nowrap; }
  #mic { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center;
         background: transparent; border: 1px solid rgba(var(--c-rgb), .3); color: rgba(190, 236, 255, .55);
         cursor: pointer; transition: background .35s, border-color .35s, color .35s; }
  body.listening #mic { background: rgba(var(--c-rgb), .18); border-color: var(--c); color: var(--c); }
  #mic:hover:not(:disabled) { color: var(--c); }
  #mic:disabled { opacity: .35; cursor: default; }
  #mic svg { width: 16px; height: 16px; }
</style>
</head>
<body data-state="idle" data-anchor="top">

<div id="stream">
  <section id="log"></section>
  <div id="live" class="shape"><div class="glow"></div><span class="label" id="live-label"></span><span class="text" id="live-text"></span></div>
  <div id="confirm" class="shape">
    <span class="label">AUTHORIZATION REQUIRED</span>
    <div class="q" id="confirm-q"></div>
    <div class="buttons"><button class="deny" id="deny">DENY<kbd>N</kbd></button><button id="approve">APPROVE<kbd>Y</kbd></button></div>
  </div>
  <div class="inputbar shape" data-radius="pill">
    <input id="input" autocomplete="off" spellcheck="false" placeholder="Tell Jev what to do…">
    <div id="bars"></div>
    <span id="hotkey">⌃⌥J</span>
    <button id="mic" disabled title="Voice input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const body = document.body;
  const log = $("#log"), input = $("#input");
  let apiObj = null, status = {}, history = [], histIdx = -1, lastUser = null;
  let autoHideTimer = null, typing = Promise.resolve(), pendingConfirm = null;
  let assistState = "idle", assistLabel = "", voiceState = null, voiceText = "", phaseAction = "";
  let level = 0, levelAt = 0;                       // real mic level from Python (0..1), if any
  for (let i = 0; i < 16; i++) $("#bars").appendChild(document.createElement("span"));

  // ------------------------------------------------------------ state → colour, live bubble
  const pretty = (m) => (m || "").replace(/^gemini-/, "Gemini ").replace(/-/g, " ").replace(/\b(\w)/g, c => c.toUpperCase());
  const ACTION_TEXT = { play_music: () => status.spotify ? "Starting it on Spotify…" : "Starting the music…",
                        play_video: () => "Finding it on YouTube…", open_app: () => "Opening it…",
                        close_app: () => "Closing it…", web_search: () => "Searching…", open_website: () => "Opening it…" };

  function render() {
    // what's shown, by priority: you talking > Jev working > Jev speaking a reply > idle
    let shown = "idle", label = "", text = "";
    if (voiceState === "listening" || voiceState === "transcribing") {
      shown = voiceState; label = voiceState === "listening" ? "Listening" : "Transcribing";
      text = voiceText || (voiceState === "listening" ? "Listening…" : "…");
    } else if (["routing", "action", "fast", "deep"].includes(assistState)) {
      shown = assistState;
      label = { routing: "Routing · Jev", action: "Executing · " + phaseAction.replace(/_/g, " "),
                fast: "Thinking · " + pretty(assistLabel), deep: "Deep reasoning · " + pretty(assistLabel) }[assistState];
      text = { routing: "Routing…", action: (ACTION_TEXT[phaseAction] || (() => "Working…"))(),
               fast: "Thinking…", deep: "Thinking it through…" }[assistState];
    } else if (voiceState === "speaking") {
      shown = "speaking"; label = "Responding"; text = voiceText;
    } else if (assistState === "confirm" || assistState === "error") {
      shown = assistState;
    }
    body.dataset.state = shown;
    body.classList.toggle("listening", voiceState === "listening");
    const live = !!text && shown !== "idle";
    body.classList.toggle("live", live);
    if (live) { $("#live-label").textContent = label; $("#live-text").textContent = text; }
    scroll();
  }
  function setAssist(s, label) { assistState = s; if (label !== undefined) assistLabel = label; render(); }

  // ------------------------------------------------------------ transcript
  function scroll() { log.scrollTop = log.scrollHeight; }
  function entry(cls, text) {
    const el = document.createElement("div");
    el.className = "entry shape " + cls;
    el.textContent = text;
    log.appendChild(el);
    while (log.children.length > 60) log.firstElementChild.remove();
    scroll();
    return el;
  }
  function userLine(text) {
    const wrap = document.createElement("div");
    wrap.className = "msg user";
    const b = document.createElement("div");
    b.className = "bubble shape"; b.dataset.sharp = "br"; b.textContent = text;
    wrap.appendChild(b);
    log.appendChild(wrap);
    while (log.children.length > 60) log.firstElementChild.remove();
    scroll();
    return wrap;
  }
  function typeOut(text) {
    const el = entry("jev caret", "");
    el.dataset.sharp = "bl";
    typing = typing.then(() => new Promise(done => {
      let i = 0; const step = Math.max(1, Math.round(text.length / 90));  // long replies type faster
      const t = setInterval(() => {
        i += step; el.textContent = text.slice(0, i); scroll();
        if (i >= text.length) { clearInterval(t); el.classList.remove("caret"); done(); }
      }, 14);
    }));
    return typing;
  }

  function hotkeyGlyphs(spec) {
    const map = { ctrl: "⌃", control: "⌃", alt: "⌥", shift: "⇧", win: "⊞" };
    return (spec || "").split("+").map(p => map[p.trim().toLowerCase()] || p.trim().toUpperCase()).join("");
  }
  function applyStatus(s) {
    status = { ...status, ...s };
    if (status.hotkey) { $("#hotkey").textContent = hotkeyGlyphs(status.hotkey); $("#hotkey").title = status.hotkey.toUpperCase() + " · voice"; }
    $("#mic").disabled = !status.stt;
    $("#mic").title = status.stt ? "Speak a command (" + (status.hotkey || "hotkey").toUpperCase() + ")" : "Voice input unavailable";
    if (status.error) { setAssist("error"); entry("system", status.error); }
    if (status.hotkey_error) entry("system", "Hotkey unavailable: " + status.hotkey_error);
  }

  // ------------------------------------------------------------ auto-hide
  function scheduleAutoHide() {
    clearTimeout(autoHideTimer);
    const secs = status.auto_hide_seconds ?? 20;
    if (!secs || !body.classList.contains("shown")) return;
    autoHideTimer = setTimeout(() => {
      if (pendingConfirm || input.value || $("#stream").matches(":hover") || assistState !== "idle" || voiceState) return scheduleAutoHide();
      apiObj?.collapse();
    }, secs * 1000);
  }
  ["keydown", "mousemove", "mousedown"].forEach(e => document.addEventListener(e, () => {
    if (body.classList.contains("shown")) scheduleAutoHide();
  }));

  // ------------------------------------------------------------ events from Python
  const hud = window.hud = {
    receive(ev) {
      switch (ev.type) {
        case "status": applyStatus(ev); break;
        case "mode":
          body.classList.toggle("shown", ev.mode === "show");
          if (ev.anchor) body.dataset.anchor = ev.anchor;
          if (ev.mode === "show") { if (ev.focus !== false) setTimeout(() => input.focus(), 60); scheduleAutoHide(); scroll(); }
          break;
        case "voice": lastUser = userLine(ev.text); break;  // a spoken command
        case "voice_state":                                  // the microphone / spoken-reply loop
          if (ev.state === "partial") voiceText = ev.text;
          else if (ev.state === "idle" || ev.state === "error") { voiceState = null; voiceText = ""; }
          else { voiceState = ev.state; voiceText = ev.state === "speaking" ? ev.text : (ev.state === "listening" ? "" : voiceText); }
          render(); break;
        case "level": level = ev.v; levelAt = performance.now(); break;
        case "routing": setAssist("routing"); break;
        case "route": {
          const tgt = ev.tier === "action" ? ev.action : ev.tier === "fast" ? status.fast_model : status.deep_model;
          if (lastUser && !lastUser.querySelector(".route")) {
            const r = document.createElement("span");
            r.className = "route shape";
            r.dataset.radius = "pill";
            r.textContent = `${ev.source === "rules" ? "rules · " : ""}${tgt || ev.tier} · ${ev.latency_ms} ms`;
            lastUser.appendChild(r);
            scroll();
          }
          break;
        }
        case "phase":
          if (ev.phase === "action") { phaseAction = ev.label || ""; setAssist("action"); }
          else if (ev.phase === "fast" || ev.phase === "deep") setAssist(ev.phase, ev.label);
          break;
        case "trace": break;  // full traces live in data/jev.log
        case "say": setAssist("speaking"); typeOut(ev.text); break;
        case "done":
          typing.then(() => { if (!pendingConfirm) setAssist("idle"); });
          scheduleAutoHide();
          break;
        case "notify": entry("system", ev.text); break;
        case "confirm":
          pendingConfirm = ev.id; $("#confirm-q").textContent = ev.text; $("#confirm").classList.add("open");
          setAssist("confirm"); input.blur(); break;
        case "confirm_closed": if (pendingConfirm === ev.id) closeConfirm(); break;
      }
    }
  };

  function closeConfirm() {
    pendingConfirm = null; $("#confirm").classList.remove("open");
    setAssist("routing");
    setTimeout(() => input.focus(), 30);
  }
  function answer(yes) {
    if (!pendingConfirm) return;
    const id = pendingConfirm; closeConfirm();
    entry("system", yes ? "Authorized" : "Denied");
    apiObj?.confirm_answer(id, yes);
  }
  $("#mic").onclick = () => apiObj?.voice();
  $("#approve").onclick = () => answer(true);
  $("#deny").onclick = () => answer(false);

  // ------------------------------------------------------------ input
  function submit() {
    const text = input.value.trim();
    if (!text) return;
    history.push(text); histIdx = history.length; input.value = "";
    lastUser = userLine(text);
    setAssist("routing");
    apiObj?.submit(text);
  }
  document.addEventListener("keydown", (e) => {
    if (pendingConfirm && (e.key === "y" || e.key === "Y")) { e.preventDefault(); return answer(true); }
    if (pendingConfirm && (e.key === "n" || e.key === "N" || e.key === "Escape")) { e.preventDefault(); return answer(false); }
    if (e.key === "Escape") { apiObj?.collapse(); return; }
    if (e.target !== input) return;
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    else if (e.key === "ArrowUp" && history.length) { histIdx = Math.max(0, histIdx - 1); input.value = history[histIdx]; e.preventDefault(); }
    else if (e.key === "ArrowDown" && history.length) { histIdx = Math.min(history.length, histIdx + 1); input.value = history[histIdx] || ""; e.preventDefault(); }
  });
  document.addEventListener("mousedown", (e) => {  // clicking a bubble keeps typing flowing
    if (body.classList.contains("shown") && !e.target.closest("button, input, #log, #confirm")) setTimeout(() => input.focus(), 0);
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // ------------------------------------------------------------ motion: level bars + live glow
  let lv = 0;
  function frame(now) {
    const t = now / 1000;
    const real = now - levelAt < 400 ? level : null;   // Python sends ~15 levels a second while listening
    const target = body.classList.contains("listening")
      ? (real !== null ? .25 + .75 * real : .3 + .55 * Math.abs(Math.sin(t * 3.1) * Math.sin(t * 7.3 + 1)) + Math.random() * .15)
      : body.dataset.state === "speaking" ? .3 + .5 * Math.abs(Math.sin(t * 4.2) * Math.sin(t * 2.3 + .5))
      : body.classList.contains("live") ? .45 + .1 * Math.sin(t * 9) : .12 + .05 * Math.sin(t * 1.3);
    lv += (target - lv) * .25;
    if (body.classList.contains("listening")) {
      $("#bars").querySelectorAll("span").forEach((el, i) => {
        const v = Math.min(1, lv * (.3 + .7 * Math.abs(Math.sin(t * 6 + i * .9) * Math.sin(t * 2.7 + i * .37 + (i % 3)))));
        el.style.transform = `scaleY(${.12 + v * .88})`;
      });
    }
    if (body.classList.contains("live")) $("#live .glow").style.opacity = Math.min(1, .45 + lv * .7);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ------------------------------------------------------------ window shape
  // The app clips the window to these boxes, so only the bubbles are drawn over the desktop.
  let lastShapes = "";
  function reportShapes() {
    const shapes = [];
    for (const el of document.querySelectorAll(".shape")) {
      if (!el.offsetParent && el !== document.body) continue;         // display: none
      const r = el.getBoundingClientRect(), lr = log.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;
      const inLog = log.contains(el);
      const top = inLog ? Math.max(r.top, lr.top) : r.top, bottom = inLog ? Math.min(r.bottom, lr.bottom) : r.bottom;
      if (bottom - top < 1) continue;                                   // scrolled out of view
      const radius = el.dataset.radius === "pill" ? r.height / 2 : parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
      shapes.push([Math.round(r.left), Math.round(top), Math.round(r.width), Math.round(bottom - top), Math.round(radius), el.dataset.sharp || ""]);
    }
    const key = JSON.stringify(shapes);
    if (key !== lastShapes) { lastShapes = key; apiObj?.shape?.(shapes, window.devicePixelRatio || 1); }
  }
  function shapeLoop() { if (body.classList.contains("shown")) reportShapes(); requestAnimationFrame(shapeLoop); }
  requestAnimationFrame(shapeLoop);
  log.addEventListener("scroll", reportShapes);

  // ------------------------------------------------------------ bridge
  window.addEventListener("pywebviewready", async () => {
    apiObj = window.pywebview.api;
    applyStatus(await apiObj.ready());
  });

  // Preview mode (opened in a normal browser): fake backend so the design can be checked.
  setTimeout(() => {
    if (window.pywebview) return;
    document.documentElement.style.background = "linear-gradient(180deg,#2a9ea8 0%,#4db2b4 55%,#86c9b0 100%)";
    const later = (ms, ev) => setTimeout(() => hud.receive(ev), ms);
    apiObj = {
      submit(text) {
        const t = text.toLowerCase();
        if (t.includes("email")) {
          later(330, { type: "route", tier: "fast", source: "jev", latency_ms: 331 });
          later(360, { type: "phase", phase: "fast", label: status.fast_model });
          later(2100, { type: "confirm", id: "c1", text: "Send this email?\n  To: mom@example.com\n  Subject: Running late\n  ---\n  Hi Mom, I'll be about 20 minutes late tonight." });
          return;
        }
        if (t.includes("research") || t.includes("find") || t.includes("compare")) {
          later(340, { type: "route", tier: "deep", source: "jev", latency_ms: 342 });
          later(370, { type: "phase", phase: "deep", label: status.deep_model });
          later(4200, { type: "say", text: "The cheapest nonstop Delhi → Mumbai flight next Friday is IndiGo 6E-2134 at ₹4,812, departing 06:10." });
          later(4300, { type: "done", total_ms: 4310 });
          return;
        }
        const play = t.startsWith("play");
        later(330, { type: "route", tier: "action", action: play ? "play_music" : "open_app", source: "jev", latency_ms: 403 });
        later(340, { type: "phase", phase: "action", label: play ? "play_music" : "open_app" });
        later(1500, { type: "say", text: play ? "Playing “Wish You Were Here” by Pink Floyd on Spotify." : "Opening " + text.replace(/^(open|launch|start)\s+/i, "") + "." });
        later(1550, { type: "done", total_ms: 1548 });
      },
      confirm_answer(id, yes) {
        later(300, { type: "say", text: yes ? "Email sent to mom@example.com." : "Not sent — the draft is still open in the browser." });
        later(340, { type: "done", total_ms: 6120 });
      },
      voice() {
        later(0, { type: "voice_state", state: "listening" });
        "play wish you were here by pink floyd".split(" ").forEach((w, i, a) =>
          later(500 + i * 300, { type: "voice_state", state: "partial", text: a.slice(0, i + 1).join(" ") }));
      },
      collapse() { hud.receive({ type: "mode", mode: "hide" }); },
      quit() {},
    };
    applyStatus({ jev: true, llm: true, spotify: true, stt: true, hotkey: "ctrl+alt+j",
                  fast_model: "gemini-3.5-flash-lite", deep_model: "gemini-3.8-flash", auto_hide_seconds: 0 });
